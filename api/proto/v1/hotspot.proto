syntax = "proto3";

package polyglot.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

// ── Hotspot Profile ───────────────────────────────────────────────────

message HotspotProfile {
  string id = 1;
  string name = 2;
  string shared_users = 3;
  string rate_limit = 4;
  string mode_expire = 5;
  string validity = 6;
  double price = 7;
  double selling_price = 8;
  string lock_user = 9;
  string parent_queue = 10;
  string comment = 11;
  string address_pool = 12;
  string lock_server = 13;
}

message HotspotProfileParams {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string address_pool = 2;
  string shared_users = 3;
  string rate_limit = 4; // "5M/5M"
  string parent_queue = 5;
  string price = 6;
  string selling_price = 7;
  string validity = 8; // "1d", "7d", "30d"
  string expire_mode = 9; // "0" | "ntf" | "ntfc" | "rem" | "remc"
  bool lock_user = 10;
  bool lock_server = 11;
  bool enable_recording = 12;
  string comment = 13;
}

message ListHotspotProfilesRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListHotspotProfilesResponse {
  repeated HotspotProfile profiles = 1;
}

message CreateHotspotProfileRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  HotspotProfileParams profile = 2 [(buf.validate.field).required = true];
}

message CreateHotspotProfileResponse {
  HotspotProfile profile = 1;
  string message = 2;
}

message UpdateHotspotProfileRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
  HotspotProfileParams profile = 3 [(buf.validate.field).required = true];
}

message UpdateHotspotProfileResponse {
  HotspotProfile profile = 1;
  string message = 2;
}

message DeleteHotspotProfileRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteHotspotProfileResponse {
  string message = 1;
}

// ── Hotspot User ──────────────────────────────────────────────────────

message HotspotUser {
  string id = 1;
  string name = 2;
  string password = 3;
  string profile = 4;
  string limit_uptime = 5;
  string limit_bytes = 6;
  string uptime = 7;
  string bytes_in = 8;
  string bytes_out = 9;
  string comment = 10;
  bool disabled = 11;
  string server = 12;
}

message ListHotspotUsersRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string profile = 2;
  string comment = 3;
  bool only_unused = 4;
}

message ListHotspotUsersResponse {
  repeated HotspotUser users = 1;
}

message GetHotspotUserRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
}

message GetHotspotUserResponse {
  HotspotUser user = 1;
}

message CreateHotspotUserRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string server = 2;
  string name = 3 [(buf.validate.field).string.min_len = 1];
  string password = 4;
  string profile = 5 [(buf.validate.field).string.min_len = 1];
  string mac_address = 6;
  string time_limit = 7; // "8h", "30d"
  string data_limit = 8; // "1000M" -> byte via ParseDataLimit
  string comment = 9;
}

message CreateHotspotUserResponse {
  HotspotUser user = 1;
  string message = 2;
}

message UpdateHotspotUserRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
  bool reset_counter = 3; // reset-counters dulu sebelum set (legacy reset=yes)
  string server = 4;
  string name = 5;
  string password = 6;
  string profile = 7;
  string mac_address = 8;
  string time_limit = 9;
  string data_limit = 10;
  string comment = 11;
  string expire_date = 12; // logika rebuild comment legacy
  string user_code = 13;   // logika rebuild comment legacy (prefix lama vc-/up-/X-)
}

message UpdateHotspotUserResponse {
  HotspotUser user = 1;
  string message = 2;
}

message ResetHotspotUserCountersRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
}

message ResetHotspotUserCountersResponse {
  string message = 1;
}

message DeleteHotspotUserRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteHotspotUserResponse {
  string message = 1;
}

message DeleteHotspotUsersRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string mode = 2 [(buf.validate.field).string = {in: ["profile", "comment", "expired"]}]; // "profile" | "comment" | "expired"
  string value = 3; // nama profile atau batch comment
}

message DeleteHotspotUsersResponse {
  int32 deleted_count = 1;
  string message = 2;
}

// ── Hotspot Active Sessions ───────────────────────────────────────────

message HotspotActiveSession {
  string id = 1;
  string server = 2;
  string user = 3;
  string address = 4;
  string mac_address = 5;
  string comment = 6;
}

message ListHotspotActiveSessionsRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListHotspotActiveSessionsResponse {
  repeated HotspotActiveSession sessions = 1;
}

message KickHotspotSessionRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
}

message KickHotspotSessionResponse {
  string message = 1;
}

// ── Vouchers & Generation ─────────────────────────────────────────────

message GenerateVouchersRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string profile = 2 [(buf.validate.field).string.min_len = 1];
  int32 count = 3 [(buf.validate.field).int32.gt = 0];
  string user_type = 4;
  int32 user_length = 5;
  string prefix = 6;
  string character_set = 7;
  string server = 8;
  string time_limit = 9;
  string data_limit = 10;
  string comment = 11;
}

message GenerateVouchersResponse {
  repeated HotspotUser vouchers = 1;
  string message = 2;
}

message GetVoucherBatchRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string comment = 2 [(buf.validate.field).string.min_len = 1]; // tag batch (gcomment)
}

message GetVoucherBatchResponse {
  repeated HotspotUser vouchers = 1;
  int32 count = 2;
}

message CheckVoucherStatusRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string username = 2 [(buf.validate.field).string.min_len = 1];
}

message CheckVoucherStatusResponse {
  bool found = 1;
  HotspotUser user = 2;
  HotspotProfile profile = 3;
  bool is_online = 4;
  HotspotActiveSession active_session = 5;
  bool has_cookie = 6;
  HotspotCookie cookie = 7;
  string status = 8; // "active" | "expired" | "unused" | "disabled" | "not_found"
  string sisa_waktu = 9;
  string sisa_kuota = 10;
  string expire_date = 11;
  string mac_locked = 12;
  string message = 13;
}

// ── Hosts & Servers ───────────────────────────────────────────────────

message HotspotHost {
  string id = 1;
  string mac_address = 2;
  string address = 3;
  string to_address = 4;
  string server = 5;
  bool bypassed = 6;
  bool authorized = 7;
  string comment = 8;
}

message ListHotspotHostsRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListHotspotHostsResponse {
  repeated HotspotHost hosts = 1;
}

message RemoveHotspotHostRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
}

message RemoveHotspotHostResponse {
  string message = 1;
}

message HotspotServerInfo {
  string id = 1;
  string name = 2;
  string interface = 3;
  string address_pool = 4;
  bool disabled = 5;
  string comment = 6;
}

message ListHotspotServersRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListHotspotServersResponse {
  repeated HotspotServerInfo servers = 1;
}

// ── IP Bindings ───────────────────────────────────────────────────────

message HotspotIPBinding {
  string id = 1;
  string mac_address = 2;
  string address = 3;
  string to_address = 4;
  string server = 5;
  string type = 6; // "bypassed" | "blocked" | "regular"
  string comment = 7;
  bool disabled = 8;
}

message ListHotspotIPBindingsRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListHotspotIPBindingsResponse {
  repeated HotspotIPBinding bindings = 1;
}

message CreateHotspotIPBindingRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string mac_address = 2;
  string address = 3;
  string to_address = 4;
  string server = 5;
  string type = 6 [(buf.validate.field).string = {in: ["bypassed", "blocked", "regular"]}];
  string comment = 7;
  bool disabled = 8;
}

message CreateHotspotIPBindingResponse {
  HotspotIPBinding binding = 1;
  string message = 2;
}

message UpdateHotspotIPBindingRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
  string mac_address = 3;
  string address = 4;
  string to_address = 5;
  string server = 6;
  string type = 7;
  string comment = 8;
  bool disabled = 9;
}

message UpdateHotspotIPBindingResponse {
  HotspotIPBinding binding = 1;
  string message = 2;
}

message DeleteHotspotIPBindingRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteHotspotIPBindingResponse {
  string message = 1;
}

// ── Cookies ───────────────────────────────────────────────────────────

message HotspotCookie {
  string id = 1;
  string user = 2;
  string mac_address = 3;
  string expires_in = 4;
  string domain = 5;
}

message ListHotspotCookiesRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListHotspotCookiesResponse {
  repeated HotspotCookie cookies = 1;
}

message DeleteHotspotCookieRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2; // jika "all" atau kosong, hapus semua cookie
}

message DeleteHotspotCookieResponse {
  string message = 1;
}

// ── Reports ───────────────────────────────────────────────────────────

message HotspotReport {
  string id = 1;
  string date = 2;
  string time = 3;
  string username = 4;
  string profile = 5;
  double price = 6;
  string comment = 7;
}

message ListHotspotReportsRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string day = 2;   // legacy get_report: "aug/17/2026" (filter source)
  string month = 3; // legacy get_livereport: "aug2026" (filter owner)
  string year = 4;  // filter suffix tanggal ("2026")
  bool summary_only = 5; // tanpa daftar record, hanya total_income + total
}

message ListHotspotReportsResponse {
  repeated HotspotReport reports = 1;
  double total_income = 2;
  int32 total = 3;
}

message DeleteHotspotReportRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string ros_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteHotspotReportResponse {
  string message = 1;
}

// ── Expire Monitor ────────────────────────────────────────────────────

message ExpireMonitorStatusResponse {
  bool is_installed = 1;
  bool is_enabled = 2;
  string status = 3;  // "ok" | "not ready" (kompatibel frontend legacy)
  string scheduler_name = 4;
}

message GetExpireMonitorStatusRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message SetupExpireMonitorRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string interval = 2; // "00:01:00" (HH:MM:SS)
}

message SetupExpireMonitorResponse {
  string message = 1;
}

message DisableExpireMonitorRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message DisableExpireMonitorResponse {
  string message = 1;
}

message RemoveExpireMonitorRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}

message RemoveExpireMonitorResponse {
  string message = 1;
}

// ── Templates ─────────────────────────────────────────────────────────

message TemplateInfo {
  string name = 1; // default | small | thermal
  repeated string sections = 2; // header, row, footer
}

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated TemplateInfo templates = 1;
}

message GetTemplateSectionRequest {
  string template_name = 1 [(buf.validate.field).string.min_len = 1]; // default | small | thermal
  string section = 2 [(buf.validate.field).string.min_len = 1];       // header | row | footer
}

message GetTemplateSectionResponse {
  string content = 1;
}

message RenderVouchersRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
  string template_name = 2 [(buf.validate.field).string.min_len = 1]; // default | small | thermal
  string comment = 3;       // tag batch (eksklusif dengan user_id)
  string user_id = 4;       // single by .id (eksklusif dengan comment)
  bool preview = 5;         // data dummy tanpa koneksi router
}

message RenderVouchersResponse {
  string html = 1;
  int32 total_vouchers = 2;
}

service HotspotService {
  // Profiles
  rpc ListProfiles(ListHotspotProfilesRequest) returns (ListHotspotProfilesResponse);
  rpc CreateProfile(CreateHotspotProfileRequest) returns (CreateHotspotProfileResponse);
  rpc UpdateProfile(UpdateHotspotProfileRequest) returns (UpdateHotspotProfileResponse);
  rpc DeleteProfile(DeleteHotspotProfileRequest) returns (DeleteHotspotProfileResponse);

  // Users
  rpc ListUsers(ListHotspotUsersRequest) returns (ListHotspotUsersResponse);
  rpc GetUser(GetHotspotUserRequest) returns (GetHotspotUserResponse);
  rpc CreateUser(CreateHotspotUserRequest) returns (CreateHotspotUserResponse);
  rpc UpdateUser(UpdateHotspotUserRequest) returns (UpdateHotspotUserResponse);
  rpc ResetUserCounters(ResetHotspotUserCountersRequest) returns (ResetHotspotUserCountersResponse);
  rpc DeleteUser(DeleteHotspotUserRequest) returns (DeleteHotspotUserResponse);
  rpc DeleteHotspotUsers(DeleteHotspotUsersRequest) returns (DeleteHotspotUsersResponse);

  // Active Sessions
  rpc ListActiveSessions(ListHotspotActiveSessionsRequest) returns (ListHotspotActiveSessionsResponse);
  rpc KickActiveSession(KickHotspotSessionRequest) returns (KickHotspotSessionResponse);

  // Vouchers
  rpc GenerateVouchers(GenerateVouchersRequest) returns (GenerateVouchersResponse);
  rpc GetVoucherBatch(GetVoucherBatchRequest) returns (GetVoucherBatchResponse);
  rpc CheckVoucherStatus(CheckVoucherStatusRequest) returns (CheckVoucherStatusResponse);

  // Hosts & Servers
  rpc ListHosts(ListHotspotHostsRequest) returns (ListHotspotHostsResponse);
  rpc RemoveHost(RemoveHotspotHostRequest) returns (RemoveHotspotHostResponse);
  rpc ListHotspotServers(ListHotspotServersRequest) returns (ListHotspotServersResponse);

  // IP Bindings
  rpc ListHotspotIPBindings(ListHotspotIPBindingsRequest) returns (ListHotspotIPBindingsResponse);
  rpc CreateHotspotIPBinding(CreateHotspotIPBindingRequest) returns (CreateHotspotIPBindingResponse);
  rpc UpdateHotspotIPBinding(UpdateHotspotIPBindingRequest) returns (UpdateHotspotIPBindingResponse);
  rpc DeleteHotspotIPBinding(DeleteHotspotIPBindingRequest) returns (DeleteHotspotIPBindingResponse);

  // Cookies
  rpc ListHotspotCookies(ListHotspotCookiesRequest) returns (ListHotspotCookiesResponse);
  rpc DeleteHotspotCookie(DeleteHotspotCookieRequest) returns (DeleteHotspotCookieResponse);

  // Reports
  rpc ListReports(ListHotspotReportsRequest) returns (ListHotspotReportsResponse);
  rpc DeleteReport(DeleteHotspotReportRequest) returns (DeleteHotspotReportResponse);

  // Expire Monitor
  rpc GetExpireMonitorStatus(GetExpireMonitorStatusRequest) returns (ExpireMonitorStatusResponse);
  rpc SetupExpireMonitor(SetupExpireMonitorRequest) returns (SetupExpireMonitorResponse);
  rpc DisableExpireMonitor(DisableExpireMonitorRequest) returns (DisableExpireMonitorResponse);
  rpc RemoveExpireMonitor(RemoveExpireMonitorRequest) returns (RemoveExpireMonitorResponse);

  // Templates
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc GetTemplateSection(GetTemplateSectionRequest) returns (GetTemplateSectionResponse);
  rpc RenderVouchers(RenderVouchersRequest) returns (RenderVouchersResponse);
}
