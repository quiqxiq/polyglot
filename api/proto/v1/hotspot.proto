syntax = "proto3";

package polyglot.v1;

option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

message HotspotProfile {
  string id = 1;
  string name = 2;
  string shared_users = 3;
  string rate_limit = 4;
  string mode_expire = 5;
  string validity = 6;
  double price = 7;
  double selling_price = 8;
  string lock_user = 9;
  string parent_queue = 10;
  string comment = 11;
  string address_pool = 12;
  string lock_server = 13;
}

message HotspotUser {
  string id = 1;
  string name = 2;
  string password = 3;
  string profile = 4;
  string limit_uptime = 5;
  string limit_bytes = 6;
  string uptime = 7;
  string bytes_in = 8;
  string bytes_out = 9;
  string comment = 10;
  bool disabled = 11;
  string server = 12;
}

message HotspotActiveSession {
  string id = 1;
  string server = 2;
  string user = 3;
  string address = 4;
  string mac_address = 5;
  string uptime = 6;
  string bytes_in = 7;
  string bytes_out = 8;
  string comment = 9;
}

message DHCPLease {
  string id = 1;
  string address = 2;
  string mac_address = 3;
  string host_name = 4;
  string status = 5;
  bool blocked = 6;
  string comment = 7;
}

message HotspotReport {
  string id = 1;
  string date = 2;
  string time = 3;
  string username = 4;
  string profile = 5;
  double price = 6;
  string comment = 7;
}

message ListHotspotProfilesRequest {
  string device_id = 1;
}

message ListHotspotProfilesResponse {
  repeated HotspotProfile profiles = 1;
}

message ListHotspotUsersRequest {
  string device_id = 1;
  string profile = 2;
  string comment = 3;
  bool only_unused = 4;
}

message ListHotspotUsersResponse {
  repeated HotspotUser users = 1;
}

message ListHotspotActiveSessionsRequest {
  string device_id = 1;
}

message ListHotspotActiveSessionsResponse {
  repeated HotspotActiveSession sessions = 1;
}

message KickHotspotSessionRequest {
  string device_id = 1;
  string ros_id = 2;
}

message KickHotspotSessionResponse {
  string message = 1;
}

message ListDHCPLeasesRequest {
  string device_id = 1;
  string mac_filter = 2;
}

message ListDHCPLeasesResponse {
  repeated DHCPLease leases = 1;
}

message BlockDHCPLeaseRequest {
  string device_id = 1;
  string ros_id = 2;
  bool blocked = 3;
  string comment = 4;
}

message BlockDHCPLeaseResponse {
  string message = 1;
}

message GenerateVouchersRequest {
  string device_id = 1;
  string profile = 2;
  int32 count = 3;
  string user_type = 4;
  int32 user_length = 5;
  string prefix = 6;
  string character_set = 7;
  string server = 8;
  string time_limit = 9;
  string data_limit = 10;
  string comment = 11;
}

message GenerateVouchersResponse {
  repeated HotspotUser vouchers = 1;
  string message = 2;
}

// ── Modul 04: Hotspot User CRUD ───────────────────────────────────────
message GetHotspotUserRequest {
  string device_id = 1;
  string ros_id = 2;
}

message GetHotspotUserResponse {
  HotspotUser user = 1;
}

message CreateHotspotUserRequest {
  string device_id = 1;
  string server = 2;
  string name = 3;
  string password = 4;
  string profile = 5;
  string mac_address = 6;
  string time_limit = 7; // "8h", "30d"
  string data_limit = 8; // "1000M" -> byte via ParseDataLimit
  string comment = 9;
}

message CreateHotspotUserResponse {
  HotspotUser user = 1;
  string message = 2;
}

message UpdateHotspotUserRequest {
  string device_id = 1;
  string ros_id = 2;
  bool reset_counter = 3; // reset-counters dulu sebelum set (legacy reset=yes)
  string server = 4;
  string name = 5;
  string password = 6;
  string profile = 7;
  string mac_address = 8;
  string time_limit = 9;
  string data_limit = 10;
  string comment = 11;
  string expire_date = 12; // logika rebuild comment legacy
  string user_code = 13;   // logika rebuild comment legacy (prefix lama vc-/up-/X-)
}

message UpdateHotspotUserResponse {
  HotspotUser user = 1;
  string message = 2;
}

message ResetHotspotUserCountersRequest {
  string device_id = 1;
  string ros_id = 2;
}

message ResetHotspotUserCountersResponse {
  string message = 1;
}

message DeleteHotspotUserRequest {
  string device_id = 1;
  string ros_id = 2;
}

message DeleteHotspotUserResponse {
  string message = 1;
}

// ── Modul 05: Hotspot Profile CRUD ────────────────────────────────────
message HotspotProfileParams {
  string name = 1;
  string address_pool = 2;
  string shared_users = 3;
  string rate_limit = 4; // "5M/5M"
  string parent_queue = 5;
  string price = 6;
  string selling_price = 7;
  string validity = 8; // "1d", "7d", "30d"
  string expire_mode = 9; // "0" | "ntf" | "ntfc" | "rem" | "remc"
  bool lock_user = 10;
  bool lock_server = 11;
  bool enable_recording = 12;
  string comment = 13;
}

message CreateHotspotProfileRequest {
  string device_id = 1;
  HotspotProfileParams profile = 2;
}

message CreateHotspotProfileResponse {
  HotspotProfile profile = 1;
  string message = 2;
}

message UpdateHotspotProfileRequest {
  string device_id = 1;
  string ros_id = 2;
  HotspotProfileParams profile = 3;
}

message UpdateHotspotProfileResponse {
  HotspotProfile profile = 1;
  string message = 2;
}

message DeleteHotspotProfileRequest {
  string device_id = 1;
  string ros_id = 2;
}

message DeleteHotspotProfileResponse {
  string message = 1;
}

// ── Modul 06: Host & Server ───────────────────────────────────────────
message HotspotHost {
  string id = 1;
  string mac_address = 2;
  string address = 3;
  string to_address = 4;
  string server = 5;
  bool bypassed = 6;
  bool authorized = 7;
  string comment = 8;
}

message ListHotspotHostsRequest {
  string device_id = 1;
}

message ListHotspotHostsResponse {
  repeated HotspotHost hosts = 1;
}

message RemoveHotspotHostRequest {
  string device_id = 1;
  string ros_id = 2;
}

message RemoveHotspotHostResponse {
  string message = 1;
}

message HotspotServerInfo {
  string id = 1;
  string name = 2;
  string interface = 3;
  string address_pool = 4;
  bool disabled = 5;
  string comment = 6;
}

message ListHotspotServersRequest {
  string device_id = 1;
}

message ListHotspotServersResponse {
  repeated HotspotServerInfo servers = 1;
}

// ── Modul 07: Voucher batch query ─────────────────────────────────────
message GetVoucherBatchRequest {
  string device_id = 1;
  string comment = 2; // tag batch (gcomment)
}

message GetVoucherBatchResponse {
  repeated HotspotUser vouchers = 1;
  int32 count = 2;
}

message StreamTrafficRequest {
  string device_id = 1;
  string interface = 2;
}

message TrafficStreamData {
  string device_id = 1;
  string interface = 2;
  int64 rx_bps = 3;
  int64 tx_bps = 4;
  int64 timestamp_unix = 5;
}

message StreamResourceRequest {
  string device_id = 1;
}

message ResourceStreamData {
  string device_id = 1;
  int32 cpu_load = 2;
  string free_memory = 3;
  string uptime = 4;
  int64 timestamp_unix = 5;
}

message StreamActiveSessionsRequest {
  string device_id = 1;
  string user_filter = 2;
}

message ActiveSessionsStreamData {
  string device_id = 1;
  repeated HotspotActiveSession sessions = 2;
  int64 timestamp_unix = 3;
}

message HotspotActiveStat {
  string id = 1;
  string uptime = 2;
  string session_time_left = 3;
  string idle_time = 4;
  string bytes_in = 5;
  string bytes_out = 6;
  string packets_in = 7;
  string packets_out = 8;
}

message StreamActiveStatsRequest {
  string device_id = 1;
  string interval = 2;
}

message ActiveStatsStreamData {
  string device_id = 1;
  repeated HotspotActiveStat stats = 2;
  int64 timestamp_unix = 3;
}

// ── Modul 08: Sales Report ────────────────────────────────────────────
message ListHotspotReportsRequest {
  string device_id = 1;
  string day = 2;   // legacy get_report: "aug/17/2026" (filter source)
  string month = 3; // legacy get_livereport: "aug2026" (filter owner)
  string year = 4;  // filter suffix tanggal ("2026")
  bool summary_only = 5; // tanpa daftar record, hanya total_income + total
}

message ListHotspotReportsResponse {
  repeated HotspotReport reports = 1;
  double total_income = 2;
  int32 total = 3;
}

message DeleteHotspotReportRequest {
  string device_id = 1;
  string ros_id = 2;
}

message DeleteHotspotReportResponse {
  string message = 1;
}

// ── Modul 09: Expire Monitor ──────────────────────────────────────────
message GetExpireMonitorStatusRequest {
  string device_id = 1;
}

message ExpireMonitorStatusResponse {
  bool is_installed = 1;
  bool is_enabled = 2;
  string status = 3;  // "ok" | "not ready" (kompatibel frontend legacy)
  string scheduler_name = 4;
}

message SetupExpireMonitorRequest {
  string device_id = 1;
  string interval = 2; // "00:01:00" (HH:MM:SS)
}

message SetupExpireMonitorResponse {
  string message = 1;
}

message DisableExpireMonitorRequest {
  string device_id = 1;
}

message DisableExpireMonitorResponse {
  string message = 1;
}

message RemoveExpireMonitorRequest {
  string device_id = 1;
}

message RemoveExpireMonitorResponse {
  string message = 1;
}

// ── Modul 10: Template & Print ────────────────────────────────────────
message TemplateInfo {
  string name = 1; // default | small | thermal
  repeated string sections = 2; // header, row, footer
}

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated TemplateInfo templates = 1;
}

message GetTemplateSectionRequest {
  string template_name = 1; // default | small | thermal
  string section = 2;       // header | row | footer
}

message GetTemplateSectionResponse {
  string content = 1;
}

message RenderVouchersRequest {
  string device_id = 1;
  string template_name = 2; // default | small | thermal
  string comment = 3;       // tag batch (eksklusif dengan user_id)
  string user_id = 4;       // single by .id (eksklusif dengan comment)
  bool preview = 5;         // data dummy tanpa koneksi router
}

message RenderVouchersResponse {
  string html = 1;
  int32 total_vouchers = 2;
}

// ── Modul 03: Dashboard Monitoring (streaming terpisah) ───────────────
// Setiap sumber data punya prosedur streaming sendiri — tidak ada satu
// endpoint gabungan seperti GetDashboard legacy.

message StreamSystemSnapshotRequest {
  string device_id = 1;
  string interval = 2; // RouterOS duration ("1s", "2s"). Default "1s".
}

message SystemClockInfo {
  string time = 1;
  string date = 2;
  string time_zone_name = 3;
  string gmt_offset = 4;
}

message SystemResourceInfo {
  int32 cpu_load = 1;
  int32 cpu_count = 2;
  string cpu_frequency = 3;
  string free_memory = 4;
  string total_memory = 5;
  string free_hdd_space = 6;
  string total_hdd_space = 7;
  string architecture = 8;
  string model = 9;
  string serial_number = 10;
  string firmware_type = 11;
  string voltage = 12;
  string temperature = 13;
  string bad_blocks = 14;
  string uptime = 15;
  string version = 16;
  string board_name = 17;
}

message SystemRouterboardInfo {
  string board_name = 1;
  string model = 2;
  string serial_number = 3;
  string firmware_type = 4;
  string factory_firmware = 5;
  string current_firmware = 6;
  string upgrade_firmware = 7;
}

message SystemHealthInfo {
  string voltage = 1;
  string temperature = 2;
  string cpu_temperature = 3;
  string psu_voltage = 4;
  string psu_current = 5;
  string psu_temperature = 6;
  string fan1_speed = 7;
  string fan2_speed = 8;
}

message SystemSnapshotFrame {
  string device_id = 1;
  int64 timestamp_unix = 2;
  SystemClockInfo clock = 3;
  SystemResourceInfo resource = 4;
  SystemRouterboardInfo routerboard = 5;
  string identity = 6;
  SystemHealthInfo health = 7;
}

message StreamQueueStatsRequest {
  string device_id = 1;
  string name = 2;        // filter by queue name (?name=)
  string parent = 3;      // filter by parent queue (?parent=)
  bool parents_only = 4;  // non-dynamic static parent queues (?dynamic=false)
  string interval = 5;    // default "1s"
}

message QueueStatsItem {
  string id = 1;
  string name = 2;
  string target = 3;
  string parent = 4;
  string max_limit = 5;
  string limit_at = 6;
  string queue = 7;
  string bytes = 8;
  string packets = 9;
  string dropped = 10;
  string rate = 11;
  string packet_rate = 12;
  bool disabled = 13;
}

message QueueStatsFrame {
  string device_id = 1;
  int64 timestamp_unix = 2;
  repeated QueueStatsItem queues = 3;
}

message StreamLogsRequest {
  string device_id = 1;
  string topics = 2; // filter (?topics~=)
}

message LogEntryItem {
  string id = 1;
  string time = 2;
  string topics = 3;
  string message = 4;
}

message LogsStreamFrame {
  string device_id = 1;
  int64 timestamp_unix = 2;
  repeated LogEntryItem logs = 3;
}

message StreamInterfaceEthernetRequest {
  string device_id = 1;
  string interval = 2; // default "1s"
}

message InterfaceEthernetItem {
  string id = 1;
  string name = 2;
  string type = 3;
  string mtu = 4;
  string mac_address = 5;
  bool running = 6;
  bool disabled = 7;
  string rx_byte = 8;
  string tx_byte = 9;
  string rx_packet = 10;
  string tx_packet = 11;
  string comment = 12;
}

message InterfaceEthernetFrame {
  string device_id = 1;
  int64 timestamp_unix = 2;
  repeated InterfaceEthernetItem interfaces = 3;
}

// Inactive hotspot users = /ip/hotspot/user/print interval −
// /ip/hotspot/active/print interval (users without an active session).
message StreamHotspotInactiveRequest {
  string device_id = 1;
  string interval = 2; // default "1s"
}

message HotspotInactiveFrame {
  string device_id = 1;
  int64 timestamp_unix = 2;
  repeated HotspotUser users = 3;
}

// PPPoE active sessions (/ppp/active/print interval).
message StreamPPPActiveRequest {
  string device_id = 1;
  string interval = 2; // default "1s"
}

message PPPActiveSessionItem {
  string id = 1;
  string name = 2;
  string service = 3;
  string caller_id = 4;
  string address = 5;
  string uptime = 6;
  string encoding = 7;
  string session_id = 8;
  string limit_bytes_in = 9;
  string limit_bytes_out = 10;
  bool radius = 11;
}

message PPPActiveFrame {
  string device_id = 1;
  int64 timestamp_unix = 2;
  repeated PPPActiveSessionItem sessions = 3;
}

// Inactive PPPoE = /ppp/secret/print interval − /ppp/active/print interval
// (secrets without an active session).
message StreamPPPInactiveRequest {
  string device_id = 1;
  string interval = 2; // default "1s"
}

message PPPSecretItem {
  string id = 1;
  string name = 2;
  string profile = 3;
  string service = 4;
  string local_address = 5;
  string remote_address = 6;
  string comment = 7;
  bool disabled = 8;
  string last_logged_out = 9;
  string caller_id = 10;
}

message PPPInactiveFrame {
  string device_id = 1;
  int64 timestamp_unix = 2;
  repeated PPPSecretItem secrets = 3;
}

// ── Modul 11: Bulk Cleaner, IP Bindings, Cookies & Voucher Checker ───

message DeleteHotspotUsersRequest {
  string device_id = 1;
  string mode = 2; // "profile" | "comment" | "expired"
  string value = 3; // nama profile atau batch comment
}

message DeleteHotspotUsersResponse {
  int32 deleted_count = 1;
  string message = 2;
}

message HotspotIPBinding {
  string id = 1;
  string mac_address = 2;
  string address = 3;
  string to_address = 4;
  string server = 5;
  string type = 6; // "bypassed" | "blocked" | "regular"
  string comment = 7;
  bool disabled = 8;
}

message ListHotspotIPBindingsRequest {
  string device_id = 1;
}

message ListHotspotIPBindingsResponse {
  repeated HotspotIPBinding bindings = 1;
}

message CreateHotspotIPBindingRequest {
  string device_id = 1;
  string mac_address = 2;
  string address = 3;
  string to_address = 4;
  string server = 5;
  string type = 6;
  string comment = 7;
  bool disabled = 8;
}

message CreateHotspotIPBindingResponse {
  HotspotIPBinding binding = 1;
  string message = 2;
}

message UpdateHotspotIPBindingRequest {
  string device_id = 1;
  string ros_id = 2;
  string mac_address = 3;
  string address = 4;
  string to_address = 5;
  string server = 6;
  string type = 7;
  string comment = 8;
  bool disabled = 9;
}

message UpdateHotspotIPBindingResponse {
  HotspotIPBinding binding = 1;
  string message = 2;
}

message DeleteHotspotIPBindingRequest {
  string device_id = 1;
  string ros_id = 2;
}

message DeleteHotspotIPBindingResponse {
  string message = 1;
}

message HotspotCookie {
  string id = 1;
  string user = 2;
  string mac_address = 3;
  string expires_in = 4;
  string domain = 5;
}

message ListHotspotCookiesRequest {
  string device_id = 1;
}

message ListHotspotCookiesResponse {
  repeated HotspotCookie cookies = 1;
}

message DeleteHotspotCookieRequest {
  string device_id = 1;
  string ros_id = 2; // jika "all" atau kosong, hapus semua cookie
}

message DeleteHotspotCookieResponse {
  string message = 1;
}

message CheckVoucherStatusRequest {
  string device_id = 1;
  string username = 2;
}

message CheckVoucherStatusResponse {
  bool found = 1;
  HotspotUser user = 2;
  HotspotProfile profile = 3;
  bool is_online = 4;
  HotspotActiveSession active_session = 5;
  bool has_cookie = 6;
  HotspotCookie cookie = 7;
  string status = 8; // "active" | "expired" | "unused" | "disabled" | "not_found"
  string sisa_waktu = 9;
  string sisa_kuota = 10;
  string expire_date = 11;
  string mac_locked = 12;
  string message = 13;
}

service HotspotService {
  rpc ListProfiles(ListHotspotProfilesRequest) returns (ListHotspotProfilesResponse);
  rpc ListUsers(ListHotspotUsersRequest) returns (ListHotspotUsersResponse);
  rpc ListActiveSessions(ListHotspotActiveSessionsRequest) returns (ListHotspotActiveSessionsResponse);
  rpc KickActiveSession(KickHotspotSessionRequest) returns (KickHotspotSessionResponse);
  rpc ListDHCPLeases(ListDHCPLeasesRequest) returns (ListDHCPLeasesResponse);
  rpc BlockDHCPLease(BlockDHCPLeaseRequest) returns (BlockDHCPLeaseResponse);
  rpc GenerateVouchers(GenerateVouchersRequest) returns (GenerateVouchersResponse);
  rpc GetVoucherBatch(GetVoucherBatchRequest) returns (GetVoucherBatchResponse);
  rpc GetUser(GetHotspotUserRequest) returns (GetHotspotUserResponse);
  rpc CreateUser(CreateHotspotUserRequest) returns (CreateHotspotUserResponse);
  rpc UpdateUser(UpdateHotspotUserRequest) returns (UpdateHotspotUserResponse);
  rpc ResetUserCounters(ResetHotspotUserCountersRequest) returns (ResetHotspotUserCountersResponse);
  rpc DeleteUser(DeleteHotspotUserRequest) returns (DeleteHotspotUserResponse);
  rpc DeleteHotspotUsers(DeleteHotspotUsersRequest) returns (DeleteHotspotUsersResponse);
  rpc CreateProfile(CreateHotspotProfileRequest) returns (CreateHotspotProfileResponse);
  rpc UpdateProfile(UpdateHotspotProfileRequest) returns (UpdateHotspotProfileResponse);
  rpc DeleteProfile(DeleteHotspotProfileRequest) returns (DeleteHotspotProfileResponse);
  rpc ListHosts(ListHotspotHostsRequest) returns (ListHotspotHostsResponse);
  rpc RemoveHost(RemoveHotspotHostRequest) returns (RemoveHotspotHostResponse);
  rpc ListHotspotServers(ListHotspotServersRequest) returns (ListHotspotServersResponse);
  rpc ListHotspotIPBindings(ListHotspotIPBindingsRequest) returns (ListHotspotIPBindingsResponse);
  rpc CreateHotspotIPBinding(CreateHotspotIPBindingRequest) returns (CreateHotspotIPBindingResponse);
  rpc UpdateHotspotIPBinding(UpdateHotspotIPBindingRequest) returns (UpdateHotspotIPBindingResponse);
  rpc DeleteHotspotIPBinding(DeleteHotspotIPBindingRequest) returns (DeleteHotspotIPBindingResponse);
  rpc ListHotspotCookies(ListHotspotCookiesRequest) returns (ListHotspotCookiesResponse);
  rpc DeleteHotspotCookie(DeleteHotspotCookieRequest) returns (DeleteHotspotCookieResponse);
  rpc CheckVoucherStatus(CheckVoucherStatusRequest) returns (CheckVoucherStatusResponse);
  rpc StreamTraffic(StreamTrafficRequest) returns (stream TrafficStreamData);
  rpc StreamResource(StreamResourceRequest) returns (stream ResourceStreamData);
  rpc StreamActiveSessions(StreamActiveSessionsRequest) returns (stream ActiveSessionsStreamData);
  rpc StreamActiveStats(StreamActiveStatsRequest) returns (stream ActiveStatsStreamData);
  rpc StreamSystemSnapshot(StreamSystemSnapshotRequest) returns (stream SystemSnapshotFrame);
  rpc StreamInterfaceEthernet(StreamInterfaceEthernetRequest) returns (stream InterfaceEthernetFrame);
  rpc StreamQueueStats(StreamQueueStatsRequest) returns (stream QueueStatsFrame);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogsStreamFrame);
  rpc StreamHotspotInactive(StreamHotspotInactiveRequest) returns (stream HotspotInactiveFrame);
  rpc StreamPPPActive(StreamPPPActiveRequest) returns (stream PPPActiveFrame);
  rpc StreamPPPInactive(StreamPPPInactiveRequest) returns (stream PPPInactiveFrame);
  rpc ListReports(ListHotspotReportsRequest) returns (ListHotspotReportsResponse);
  rpc DeleteReport(DeleteHotspotReportRequest) returns (DeleteHotspotReportResponse);
  rpc GetExpireMonitorStatus(GetExpireMonitorStatusRequest) returns (ExpireMonitorStatusResponse);
  rpc SetupExpireMonitor(SetupExpireMonitorRequest) returns (SetupExpireMonitorResponse);
  rpc DisableExpireMonitor(DisableExpireMonitorRequest) returns (DisableExpireMonitorResponse);
  rpc RemoveExpireMonitor(RemoveExpireMonitorRequest) returns (RemoveExpireMonitorResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc GetTemplateSection(GetTemplateSectionRequest) returns (GetTemplateSectionResponse);
  rpc RenderVouchers(RenderVouchersRequest) returns (RenderVouchersResponse);
}
