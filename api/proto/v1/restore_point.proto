syntax = "proto3";

package polyglot.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

message RestorePointArtifact {
  string kind = 1; // SCOPED_EXPORT | BINARY_BACKUP | INVERSE_SCRIPT
  repeated string scope = 2;
  string sha256 = 3;
  int64 size_bytes = 4;
}

message RestorePoint {
  string id = 1;
  string device_id = 2;
  string trigger = 3; // MUTATION | SCHEDULED | MANUAL
  string status = 4; // CREATING | AVAILABLE | PARTIAL | USED | EXPIRED | DELETED
  repeated string scope = 5;
  string routeros_version = 6;
  int64 total_size_bytes = 7;
  repeated RestorePointArtifact artifacts = 8;
  int64 created_at_unix = 9;
  int64 expires_at_unix = 10;
  int64 used_at_unix = 11;
}

message ListRestorePointsRequest {
  string device_id = 1;
  string status = 2;
  int32 limit = 3;
  int32 offset = 4;
}
message ListRestorePointsResponse {
  repeated RestorePoint restore_points = 1;
  int32 total = 2;
}

message GetRestorePointRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetRestorePointResponse { RestorePoint restore_point = 1; }

message CreateRestorePointRequest {
  string device_id = 1 [(buf.validate.field).string.min_len = 1];
}
message CreateRestorePointResponse { RestorePoint restore_point = 1; }

enum RestoreMode {
  RESTORE_MODE_UNSPECIFIED = 0;
  RESTORE_MODE_INVERSE = 1;
  RESTORE_MODE_SCOPED_EXPORT = 2;
  RESTORE_MODE_BINARY = 3;
}

message RestoreFromPointRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  RestoreMode mode = 2;
  string confirmation = 3; // typed device name
}
message RestoreFromPointResponse { RestorePoint restore_point = 1; }

message DownloadRestorePointArtifactRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string kind = 2; // SCOPED_EXPORT | BINARY_BACKUP | INVERSE_SCRIPT
}
message DownloadRestorePointArtifactResponse {
  bytes payload = 1;
  string content_type = 2;
  string filename = 3;
}

message DeleteRestorePointRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message DeleteRestorePointResponse { string message = 1; }

service RestorePointService {
  rpc ListRestorePoints(ListRestorePointsRequest) returns (ListRestorePointsResponse);
  rpc GetRestorePoint(GetRestorePointRequest) returns (GetRestorePointResponse);
  rpc CreateRestorePoint(CreateRestorePointRequest) returns (CreateRestorePointResponse);
  rpc RestoreFromPoint(RestoreFromPointRequest) returns (RestoreFromPointResponse);
  rpc DownloadRestorePointArtifact(DownloadRestorePointArtifactRequest) returns (DownloadRestorePointArtifactResponse);
  rpc DeleteRestorePoint(DeleteRestorePointRequest) returns (DeleteRestorePointResponse);
}
