syntax = "proto3";

package polyglot.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

// ─── Pesan inti billing ─────────────────────────────────────────────────

message Invoice {
  string id = 1;
  string tenant_id = 2;
  string invoice_number = 3;
  string customer_id = 4;
  string subscription_id = 5;
  string period = 6; // 'YYYY-MM'
  double subtotal = 7;
  double discount = 8;
  double tax_amount = 9;
  double total = 10;
  double paid_amount = 11;
  int64 due_date_unix = 12;
  int64 paid_at_unix = 13;
  string status = 14; // UNPAID | PARTIAL | PAID | OVERDUE | CANCELLED
  string qr_payload = 15;
  string manual_payment_code = 16;
  string notes = 17;
  repeated InvoiceItem items = 18;
  int64 created_at_unix = 19;
}

message InvoiceItem {
  string id = 1;
  string invoice_id = 2;
  string description = 3;
  double quantity = 4;
  double unit_price = 5;
  double amount = 6;
  string item_type = 7; // SUBSCRIPTION_FEE | INSTALLATION_FEE | AD_HOC
}

// ─── Sub-Message Bertipe (Opsi 2) ──────────────────────────────────────────

message PPPoEPlanConfig {
  string remote_address_pool = 1;
  string address_list = 2;
}

message HotspotPlanConfig {
  string ip_pool_name = 1;
  int32 shared_users = 2;
  string validity = 3;
  string validity_mode = 4;
  string expire_mode = 5;
  bool lock_user = 6;
  bool lock_server = 7;
  string limit_uptime = 8;
  string limit_bytes = 9;
  double selling_price = 10;
}

message PPPoESubscriptionConfig {
  string local_address = 1;
  string remote_address = 2;
  string caller_id = 3;
  string routes = 4;
  string rate_limit = 5;
  string router_profile = 6;
}

message HotspotSubscriptionConfig {
  string server = 1;
  string mac_address = 2;
  string ip_address = 3;
  string rate_limit = 4;
  string router_profile = 5;
  string limit_uptime = 6;
  string limit_bytes = 7;
}

message Subscription {
  string id = 1;
  string tenant_id = 2;
  string customer_id = 3;
  string plan_id = 4;
  string device_id = 5; // Router BRAS target
  string service_type = 6; // PPPOE | HOTSPOT | DEDICATED
  string remote_username = 7;
  string rate_limit = 8;
  string router_profile = 9;
  string provision_status = 10; // NONE | PENDING | OK | FAILED
  string billing_cycle = 11;
  int32 billing_day = 12;
  bool auto_isolate = 13;
  int32 isolation_grace_days = 14;
  string status = 15; // ACTIVE | ISOLATED | SUSPENDED | TERMINATED | PENDING
  int64 start_date_unix = 16;
  int64 end_date_unix = 17;
  double custom_price = 18;
  string notes = 19;

  // Sub-messages bertipe (Opsi 2)
  PPPoESubscriptionConfig pppoe_config = 20;
  HotspotSubscriptionConfig hotspot_config = 21;

  // Denormalisasi Tampilan (Zero Waterfall di Frontend)
  string customer_name = 22;
  string customer_phone = 23;
  string customer_code = 24;
  string plan_name = 25;
  double plan_price = 26;
  string device_name = 27;
  string device_host = 28;
}

// ─── CRUD Langganan ─────────────────────────────────────────────────────

message CreateSubscriptionRequest {
  string customer_id = 1 [(buf.validate.field).string.min_len = 1];
  string plan_id = 2 [(buf.validate.field).string.min_len = 1];
  string device_id = 3;       // kosong = belum ditugaskan (provision PENDING)
  string service_type = 4;    // PPPOE | HOTSPOT | DEDICATED (default dari plan)
  string remote_username = 5; // kosong = auto-generate dari setting
  string remote_password = 6; // kosong = auto-generate
  double custom_price = 7;    // 0 = ikut harga plan
  string billing_cycle = 8;
  int32 billing_day = 9;
  string notes = 10;
  PPPoESubscriptionConfig pppoe_config = 11;
  HotspotSubscriptionConfig hotspot_config = 12;
}
message CreateSubscriptionResponse { Subscription subscription = 1; }

message UpdateSubscriptionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string remote_username = 2;
  string remote_password = 3; // kosong = tidak diubah
  double custom_price = 4;
  string billing_cycle = 5;
  int32 billing_day = 6;
  string device_id = 7;       // reassignment; kosong = tidak diubah
  string notes = 8;
  PPPoESubscriptionConfig pppoe_config = 9;
  HotspotSubscriptionConfig hotspot_config = 10;
}
message UpdateSubscriptionResponse { Subscription subscription = 1; }

message DeleteSubscriptionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message DeleteSubscriptionResponse { string message = 1; }

message Plan {
  string id = 1;
  string name = 2;
  string service_type = 3; // PPPOE | HOTSPOT | DEDICATED
  int32 bandwidth_download_kbps = 4;
  int32 bandwidth_upload_kbps = 5;
  int32 burst_download_kbps = 6;
  int32 burst_upload_kbps = 7;
  int32 burst_threshold_kbps = 24;
  int32 burst_time_seconds = 25;
  string remote_address_pool = 26;
  double price = 8;
  double selling_price = 9;
  double installation_fee = 10;
  double tax_percent = 11;
  string validity = 12;
  string validity_mode = 13;
  int32 simultaneous_use = 14;
  string ip_pool_name = 15;
  string parent_queue = 16;
  string address_list = 17;
  int32 shared_users = 18;
  string expire_mode = 19;
  bool lock_user = 20;
  bool lock_server = 21;
  bool is_active = 22;
  string description = 23;

  // Sub-message spesifik (Opsi 2)
  PPPoEPlanConfig pppoe_config = 27;
  HotspotPlanConfig hotspot_config = 28;
}

// ─── Faktur ─────────────────────────────────────────────────────────────

message ListInvoicesRequest {
  string customer_id = 1;
  string status = 2; // kosong = semua
}
message ListInvoicesResponse { repeated Invoice invoices = 1; }

message GetInvoiceRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetInvoiceResponse { Invoice invoice = 1; }

// ─── Kasir: resolve & bayar cepat ───────────────────────────────────────

enum ResolveMethod {
  RESOLVE_CODE = 0;   // manual_payment_code
  RESOLVE_QR = 1;     // qr_payload
  RESOLVE_PORTAL = 2; // kode portal pelanggan → tagihan UNPAID tertua
}

message CashierResolveRequest {
  string identifier = 1 [(buf.validate.field).string.min_len = 1];
  ResolveMethod method = 2;
}
message CashierResolveResponse {
  Invoice invoice = 1;
  string customer_name = 2;
  string customer_phone = 3;
  string remote_username = 4;
}

message CashierPayRequest {
  string invoice_id = 1 [(buf.validate.field).string.min_len = 1];
  double amount = 2 [(buf.validate.field).double.gt = 0];
  string cash_account_id = 3 [(buf.validate.field).string.min_len = 1];
  string income_category_id = 4 [(buf.validate.field).string.min_len = 1];
  string scan_method = 5;    // QR_SCAN | CODE_INPUT | MANUAL | PAYMENT_GATEWAY
  string reference = 6;
  string notes = 7;
}
message CashierPayResponse {
  string payment_id = 1;
  string payment_no = 2;
  Invoice invoice = 3;
}

// ─── Langganan & lifecycle ──────────────────────────────────────────────

message ListSubscriptionsRequest {
  string customer_id = 1; // kosong = semua lifecycle
}
message ListSubscriptionsResponse { repeated Subscription subscriptions = 1; }

message GetSubscriptionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetSubscriptionResponse { Subscription subscription = 1; }

message ChangePlanRequest {
  string subscription_id = 1 [(buf.validate.field).string.min_len = 1];
  string new_plan_id = 2 [(buf.validate.field).string.min_len = 1];
}
message ChangePlanResponse { Subscription subscription = 1; }

message SuspendSubscriptionRequest {
  string subscription_id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2;
}
message SuspendSubscriptionResponse { Subscription subscription = 1; }

message ResumeSubscriptionRequest {
  string subscription_id = 1 [(buf.validate.field).string.min_len = 1];
}
message ResumeSubscriptionResponse { Subscription subscription = 1; }

message TerminateSubscriptionRequest {
  string subscription_id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2;
}
message TerminateSubscriptionResponse { Subscription subscription = 1; }

message ActivateSubscriptionRequest {
  string subscription_id = 1 [(buf.validate.field).string.min_len = 1];
  string device_id = 2;
}
message ActivateSubscriptionResponse { Subscription subscription = 1; }

// ─── Paket layanan ──────────────────────────────────────────────────────

message ListPlansRequest { bool active_only = 1; }
message ListPlansResponse { repeated Plan plans = 1; }

message GetPlanRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetPlanResponse { Plan plan = 1; }

message CreatePlanRequest {
  Plan plan = 1 [(buf.validate.field).required = true];
}
message CreatePlanResponse { Plan plan = 1; }

message UpdatePlanRequest {
  Plan plan = 1 [(buf.validate.field).required = true];
}
message UpdatePlanResponse { Plan plan = 1; }

message DeletePlanRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message DeletePlanResponse { string message = 1; }

// ─── Generator tagihan bulanan ──────────────────────────────────────────

message GenerateInvoicesRequest {
  string period = 1; // 'YYYY-MM'; kosong = bulan berjalan
}
message GenerateInvoicesResponse {
  int32 created = 1;
  int32 skipped = 2;
}

service BillingService {
  // Faktur
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);

  // Kasir
  rpc CashierResolve(CashierResolveRequest) returns (CashierResolveResponse);
  rpc CashierPay(CashierPayRequest) returns (CashierPayResponse);

  // Langganan & lifecycle
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc ChangePlan(ChangePlanRequest) returns (ChangePlanResponse);
  rpc SuspendSubscription(SuspendSubscriptionRequest) returns (SuspendSubscriptionResponse);
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (ResumeSubscriptionResponse);
  rpc TerminateSubscription(TerminateSubscriptionRequest) returns (TerminateSubscriptionResponse);
  rpc ActivateSubscription(ActivateSubscriptionRequest) returns (ActivateSubscriptionResponse);

  // CRUD langsung (walk-in / operasional). Create juga tersedia dari
  // halaman Customer detail. Ganti paket tetap via ChangePlan.
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);

  // Paket layanan
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);
  rpc DeletePlan(DeletePlanRequest) returns (DeletePlanResponse);

  // Generator tagihan
  rpc GenerateInvoices(GenerateInvoicesRequest) returns (GenerateInvoicesResponse);
}
