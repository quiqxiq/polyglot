syntax = "proto3";

package polyglot.v1;

import "v1/subscription.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/quixiq/polyglot/api/gen/v1;polyglotv1";

message Customer {
  string id = 1;
  string tenant_id = 2;
  string customer_code = 3;
  string name = 4;
  string phone = 5;
  string email = 6;
  string address = 7;
  double latitude = 8;
  double longitude = 9;
  bool has_coordinates = 10;
  string portal_access_code = 11;
  string status = 12; // ACTIVE | INACTIVE
  string notes = 13;
  int64 registered_at_unix = 14;
  int64 created_at_unix = 15;
  int32 active_subscriptions_count = 16;
  int32 unpaid_invoices_count = 17;
}

message ListCustomersRequest {}
message ListCustomersResponse { repeated Customer customers = 1; }

message GetCustomerRequest { string id = 1 [(buf.validate.field).string.min_len = 1]; }
message GetCustomerResponse { Customer customer = 1; }

message CreateCustomerRequest { Customer customer = 1 [(buf.validate.field).required = true]; }
message CreateCustomerResponse {
  Customer customer = 1;
  string message = 2;
}

message UpdateCustomerRequest { Customer customer = 1 [(buf.validate.field).required = true]; }
message UpdateCustomerResponse {
  Customer customer = 1;
  string message = 2;
}

message DeleteCustomerRequest { string id = 1 [(buf.validate.field).string.min_len = 1]; }
message DeleteCustomerResponse { string message = 1; }

// Pencarian cepat untuk kasir & portal.
message FindCustomerByPhoneRequest { string phone = 1 [(buf.validate.field).string.min_len = 1]; }
message FindCustomerByCodeRequest { string customer_code = 1 [(buf.validate.field).string.min_len = 1]; }
message FindCustomerByPortalCodeRequest { string portal_access_code = 1 [(buf.validate.field).string.min_len = 1]; }
message FindCustomerResponse { Customer customer = 1; }

// ─── Customer 360 (planning v2 Fase 5) ──────────────────────────────────

message Customer360Subscription {
  string id = 1;
  string plan_id = 2;
  string service_type = 3;
  string status = 4;
  string provision_status = 5; // OK | PENDING | FAILED
  string last_provision_error = 6;
  int32 provision_attempts = 7;
  string router_profile = 8;
  string device_id = 9;
  int64 start_date_unix = 10;
  string next_due_date = 11; // YYYY-MM-DD
}

message Customer360Invoice {
  string id = 1;
  string invoice_number = 2;
  string period = 3;
  double total = 4;
  double paid_amount = 5;
  string status = 6;
  int64 due_date_unix = 7;
}

message Customer360Payment {
  string id = 1;
  string payment_no = 2;
  string invoice_id = 3;
  double amount = 4;
  int64 payment_date_unix = 5;
  string scan_method = 6;
  bool voided = 7;
  string void_reason = 8;
}

message Customer360Registration {
  string id = 1;
  string registration_no = 2;
  string status = 3;
  int64 created_at_unix = 4;
  int64 installed_at_unix = 5;
  string survey_status = 6;
  string public_token = 7;
}

message GetCustomer360Request {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetCustomer360Response {
  Customer customer = 1;
  repeated Customer360Subscription subscriptions = 2;
  repeated Customer360Invoice invoices = 3;
  repeated Customer360Payment payments = 4;
  repeated Customer360Registration registrations = 5;
}

service CustomerService {
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse);
  rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerResponse);

  // Customer 360 (Fase 5): profil + langganan + tagihan + pembayaran + PSB.
  rpc GetCustomer360(GetCustomer360Request) returns (GetCustomer360Response);

  // Lookups cepat
  rpc FindByPhone(FindCustomerByPhoneRequest) returns (FindCustomerResponse);
  rpc FindByCustomerCode(FindCustomerByCodeRequest) returns (FindCustomerResponse);
  rpc FindByPortalCode(FindCustomerByPortalCodeRequest) returns (FindCustomerResponse);

  // Kompatibilitas lama
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
}
