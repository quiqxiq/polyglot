syntax = "proto3";

package polyglot.v1;

option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

service BotService {
  rpc ListConversations (ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation (GetConversationRequest) returns (GetConversationResponse);
  rpc GetConversationContext (GetConversationContextRequest) returns (GetConversationContextResponse);
  rpc TakeOverConversation (TakeOverConversationRequest) returns (TakeOverConversationResponse);
  rpc ResetConversationBot (ResetConversationBotRequest) returns (ResetConversationBotResponse);
  rpc CloseConversation (CloseConversationRequest) returns (CloseConversationResponse);
}

message ConversationMessage {
  string id = 1;
  string sender = 2;
  string text = 3;
  string timestamp = 4;
}

message Conversation {
  string id = 1;
  string session_id = 2;
  string client_phone = 3;
  string client_name = 4;
  string status = 5; // e.g. "bot", "human", "closed"
  string assigned_technician = 6;
  repeated ConversationMessage messages = 7;
  string updated_at = 8;
}

message ListConversationsRequest {
  string session_id = 1;
}
message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message GetConversationRequest {
  string id = 1;
}
message GetConversationResponse {
  Conversation conversation = 1;
}

message TakeOverConversationRequest {
  string id = 1;
  string technician_id = 2;
}
message TakeOverConversationResponse {
  string message = 1;
}

message ResetConversationBotRequest {
  string id = 1;
}
message ResetConversationBotResponse {
  string message = 1;
}

message CloseConversationRequest {
  string id = 1;
}
message CloseConversationResponse {
  string message = 1;
}

// ConversationContextMessage adalah pesan bisnis (conversation.messages)
// dengan metrik token LLM — berbeda dari mirror wa_messages.
message ConversationContextMessage {
  string id = 1;
  string sender = 2;
  string text = 3;
  string timestamp = 4;
  int64 token_in = 5;
  int64 token_out = 6;
  string llm_config_id = 7;
}

message GetConversationContextRequest {
  string id = 1;
}

message GetConversationContextResponse {
  string conversation_id = 1;
  string status = 2; // bot | escalation | done
  string client_phone = 3;
  string summary = 4;
  repeated ConversationContextMessage recent_messages = 5;
  int64 total_token_in = 6;
  int64 total_token_out = 7;
  int64 total_llm_calls = 8;
  string updated_at = 9;
}
