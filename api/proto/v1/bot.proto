syntax = "proto3";

package polyglot.v1;

option go_package = "github.com/quixiq/polyglot/api/proto/v1;devicepb";

service BotService {
  rpc ListSessions (ListWASessionsRequest) returns (ListWASessionsResponse);
  rpc CreateSession (CreateWASessionRequest) returns (CreateWASessionResponse);
  rpc GetQRCode (GetWASessionQRRequest) returns (GetWASessionQRResponse);
  rpc GetPairingCode (GetWASessionPairingRequest) returns (GetWASessionPairingResponse);
  rpc ToggleBot (ToggleWABotRequest) returns (ToggleWABotResponse);
  rpc LogoutSession (LogoutWASessionRequest) returns (LogoutWASessionResponse);
  rpc SendTextMessage (SendWATextMessageRequest) returns (SendWATextMessageResponse);

  rpc ListConversations (ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation (GetConversationRequest) returns (GetConversationResponse);
  rpc TakeOverConversation (TakeOverConversationRequest) returns (TakeOverConversationResponse);
  rpc ResetConversationBot (ResetConversationBotRequest) returns (ResetConversationBotResponse);
  rpc CloseConversation (CloseConversationRequest) returns (CloseConversationResponse);
}

message WASession {
  string id = 1;
  string name = 2;
  string phone_number = 3;
  string status = 4;
  bool is_bot_active = 5;
  string webhook_url = 6;
  string created_at = 7;
}

message ListWASessionsRequest {}
message ListWASessionsResponse {
  repeated WASession sessions = 1;
}

message CreateWASessionRequest {
  string name = 1;
  string phone_number = 2;
}
message CreateWASessionResponse {
  WASession session = 1;
}

message GetWASessionQRRequest {
  string session_id = 1;
}
message GetWASessionQRResponse {
  string qr_code_base64 = 1;
}

message GetWASessionPairingRequest {
  string session_id = 1;
  string phone_number = 2;
}
message GetWASessionPairingResponse {
  string pairing_code = 1;
}

message ToggleWABotRequest {
  string session_id = 1;
  bool is_active = 2;
}
message ToggleWABotResponse {
  string message = 1;
  bool is_active = 2;
}

message LogoutWASessionRequest {
  string session_id = 1;
}
message LogoutWASessionResponse {
  string message = 1;
}

message SendWATextMessageRequest {
  string session_id = 1;
  string recipient_phone = 2;
  string message_text = 3;
}
message SendWATextMessageResponse {
  string message_id = 1;
  string status = 2;
}

message ConversationMessage {
  string id = 1;
  string sender = 2;
  string text = 3;
  string timestamp = 4;
}

message Conversation {
  string id = 1;
  string session_id = 2;
  string client_phone = 3;
  string client_name = 4;
  string status = 5; // e.g. "bot", "human", "closed"
  string assigned_technician = 6;
  repeated ConversationMessage messages = 7;
  string updated_at = 8;
}

message ListConversationsRequest {
  string session_id = 1;
}
message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message GetConversationRequest {
  string id = 1;
}
message GetConversationResponse {
  Conversation conversation = 1;
}

message TakeOverConversationRequest {
  string id = 1;
  string technician_id = 2;
}
message TakeOverConversationResponse {
  string message = 1;
}

message ResetConversationBotRequest {
  string id = 1;
}
message ResetConversationBotResponse {
  string message = 1;
}

message CloseConversationRequest {
  string id = 1;
}
message CloseConversationResponse {
  string message = 1;
}
