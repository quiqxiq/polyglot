syntax = "proto3";

package polyglot.v1;


option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

message ChatRequest {
  string conversation_id = 1;
  string message = 2;
  string device_id = 3;
  string model_config_id = 4;
  int64 since_event_id = 5;
}

message TextDelta { string text = 1; }
message ReasoningDelta { string text = 1; }
message ToolCallEvent {
  string id = 1;
  string name = 2;
  string args_json = 3;
}
message ToolResultEvent {
  string tool_call_id = 1;
  bool is_error = 2;
  string result = 3;
  int64 duration_ms = 4;
}
message PlanStepEvent {
  string step = 1;
  string status = 2; // pending | running | done | error
  string detail = 3;
}
message TerminalOutputEvent {
  string command = 1;
  string output = 2;
  bool is_error = 3;
}
message ApprovalRequestedEvent {
  string approval_id = 1;
  string summary = 2;
  string restore_point_id = 3;
}
message UsageEvent {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
}
message DoneEvent { string conversation_id = 1; int64 last_event_id = 2; }
message ErrorEvent { string message = 1; }

message ChatEvent {
  int64 event_id = 1;
  oneof event {
    TextDelta text = 2;
    ReasoningDelta reasoning = 3;
    ToolCallEvent tool_call = 4;
    ToolResultEvent tool_result = 5;
    PlanStepEvent plan_step = 6;
    TerminalOutputEvent terminal = 7;
    ApprovalRequestedEvent approval = 8;
    UsageEvent usage = 9;
    DoneEvent done = 10;
    ErrorEvent error = 11;
  }
}

service AIChatService {
  rpc Chat(ChatRequest) returns (stream ChatEvent);
}
