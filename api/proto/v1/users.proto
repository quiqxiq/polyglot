syntax = "proto3";

package polyglot.v1;

option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

// User adalah akun yang bisa mengakses sistem (owner/admin/agent/teknisi).
// `role` = role utama (kolom users.role), `roles` = SEMUA role efektif
// termasuk tambahan dari Casbin group assignment (multi-role).
message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  repeated string roles = 5;
  bool is_active = 6;
  string tenant_id = 7;
  int64 created_at_unix = 8;
  int64 updated_at_unix = 9;
  string full_name = 10;
  string phone_number = 11;
  string specialization = 12;
  repeated string assigned_device_ids = 13;
}

message ListUsersRequest {
  int32 page = 1;       // 1-based, default 1
  int32 page_size = 2;  // default 20, max 100
  string search = 3;    // filter case-insensitive pada username/email
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;  // plaintext; di-hash bcrypt di server
  string role = 4;      // role utama: owner|admin|agent|teknisi
  string full_name = 5;
  string phone_number = 6;
  string specialization = 7;
  repeated string assigned_device_ids = 8;
}

message CreateUserResponse {
  User user = 1;
}

// UpdateUser bersifat full-update: kirim semua field yang ingin diubah.
message UpdateUserRequest {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string full_name = 5;
  string phone_number = 6;
  string specialization = 7;
  repeated string assigned_device_ids = 8;
}

message UpdateUserResponse {
  User user = 1;
}

message ResetPasswordRequest {
  uint64 id = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
}

// ToggleActive membalik status is_active user; response mengembalikan user
// dengan status terbaru.
message ToggleActiveRequest {
  uint64 id = 1;
}

message ToggleActiveResponse {
  User user = 1;
}

message DeleteUserRequest {
  uint64 id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message AssignDevicesRequest {
  uint64 user_id = 1;
  repeated string device_ids = 2;
}

message AssignDevicesResponse {
  bool success = 1;
  repeated string assigned_device_ids = 2;
}

message ListUserDevicesRequest {
  uint64 user_id = 1;
}

message ListUserDevicesResponse {
  repeated string device_ids = 1;
}

service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ToggleActive(ToggleActiveRequest) returns (ToggleActiveResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc AssignDevicesToUser(AssignDevicesRequest) returns (AssignDevicesResponse);
  rpc ListUserAccessibleDevices(ListUserDevicesRequest) returns (ListUserDevicesResponse);
}
