syntax = "proto3";

package polyglot.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

message LoginRequest {
  string username = 1 [(buf.validate.field).string.min_len = 1];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}

message UserProfile {
  string id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  repeated string roles = 5;
  // Permissions efektif user (dari Casbin, termasuk warisan role group),
  // diflatten ke format "resource:action" (wildcard regex, mis. "user:.*:*").
  repeated string permissions = 6;
  string full_name = 7;
  string phone_number = 8;
  string specialization = 9;
}

message LoginResponse {
  string token = 1;
  UserProfile user = 2;
  int64 expires_at_unix = 3;
}

message GetMeRequest {}

message GetMeResponse {
  UserProfile user = 1;
}

message UpdateMeRequest {
  string full_name = 1;
  string phone_number = 2;
  string email = 3;
  string specialization = 4;
}

message UpdateMeResponse {
  UserProfile user = 1;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

// RefreshTokenRequest: refresh token diambil dari cookie httpOnly
// (polyglot_refresh) secara otomatis; field refresh_token hanya fallback
// untuk client non-browser.
message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string token = 1;
  int64 expires_at_unix = 2;
  int64 refresh_expires_at_unix = 3;
}

message LogoutRequest {}

message LogoutResponse {
  bool success = 1;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}
