syntax = "proto3";

package polyglot.v1;

option go_package = "github.com/quixiq/polyglot/api/gen/v1;devicepb";

message PingTelemetry {
  string probe_id = 1;
  string target_ip = 2;
  int64 latency_ms = 3;
  bool is_alive = 4;
  int64 timestamp_unix = 5;
}

message ProbeControlCommand {
  string command_id = 1;
  string action = 2;
  string target = 3;
}

message ProbeStatusRequest {
  string probe_id = 1;
  string version = 2;
  int64 uptime_seconds = 3;
}

message ProbeStatusResponse {
  bool acknowledged = 1;
  int64 server_time_unix = 2;
}

service ProbeService {
  rpc ReportStatus(ProbeStatusRequest) returns (ProbeStatusResponse);
  rpc StreamTelemetry(stream PingTelemetry) returns (stream ProbeControlCommand);
}
