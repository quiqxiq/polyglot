syntax = "proto3";

package polyglot.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/quixiq/polyglot/api/gen/v1;polyglotv1";

// AcsConfig adalah konfigurasi integrasi GenieACS yang terbaca.
message AcsConfig {
  bool enabled = 1;
  string server_device_id = 2;
  string acs_url = 3;
  int32 periodic_inform_interval = 4;
  string preset_name = 5;
}

message AcsDevice {
  string id = 1;
  string acs_device_id = 2;
  string oui = 3;
  string product_class = 4;
  string serial_number = 5;
  string software_version = 6;
  string last_inform_at = 7;
  repeated string tags = 8;
  repeated string mac_candidates = 9;
  string matched_ont_id = 10;
  string match_source = 11;
}

message GetAcsConfigRequest {}
message GetAcsConfigResponse {
  AcsConfig config = 1;
}

message SyncAcsDevicesRequest {}
message SyncAcsDevicesResponse {
  string job_id = 1;
}

message ListAcsDevicesRequest {
  bool only_unmatched = 1;
  string search = 2;
  int32 limit = 3;
}
message ListAcsDevicesResponse {
  repeated AcsDevice devices = 1;
}

message RefreshOntTelemetryRequest {
  string ont_id = 1 [(buf.validate.field).string.min_len = 1];
}
message RefreshOntTelemetryResponse {
  string job_id = 1;
}

message RebootOntRequest {
  string ont_id = 1 [(buf.validate.field).string.min_len = 1];
}
message RebootOntResponse {
  string job_id = 1;
}

message SetOntWifiRequest {
  string ont_id = 1 [(buf.validate.field).string.min_len = 1];
  string ssid = 2 [(buf.validate.field).string.min_len = 1];
  string password = 3 [(buf.validate.field).string.min_len = 1];
  string band = 4;
}
message SetOntWifiResponse {
  string job_id = 1;
}

message PushOntPppoeRequest {
  string ont_id = 1 [(buf.validate.field).string.min_len = 1];
  string username = 2 [(buf.validate.field).string.min_len = 1];
  string password = 3 [(buf.validate.field).string.min_len = 1];
}
message PushOntPppoeResponse {
  string job_id = 1;
}

message LinkOntRequest {
  string ont_id = 1 [(buf.validate.field).string.min_len = 1];
  string customer_id = 2;
  string subscription_id = 3;
  string pppoe_username = 4;
}
message LinkOntResponse {
  string message = 1;
}

message UnlinkOntRequest {
  string ont_id = 1 [(buf.validate.field).string.min_len = 1];
}
message UnlinkOntResponse {
  string message = 1;
}

message PinAcsDeviceRequest {
  string ont_id = 1 [(buf.validate.field).string.min_len = 1];
  string acs_device_id = 2 [(buf.validate.field).string.min_len = 1];
}
message PinAcsDeviceResponse {
  string message = 1;
}

message UnpinAcsDeviceRequest {
  string ont_id = 1 [(buf.validate.field).string.min_len = 1];
}
message UnpinAcsDeviceResponse {
  string message = 1;
}

message EnsureAcsPresetRequest {}
message EnsureAcsPresetResponse {
  string message = 1;
}

service OntService {
  rpc GetAcsConfig(GetAcsConfigRequest) returns (GetAcsConfigResponse);
  rpc SyncAcsDevices(SyncAcsDevicesRequest) returns (SyncAcsDevicesResponse);
  rpc ListAcsDevices(ListAcsDevicesRequest) returns (ListAcsDevicesResponse);
  rpc RefreshOntTelemetry(RefreshOntTelemetryRequest) returns (RefreshOntTelemetryResponse);
  rpc RebootOnt(RebootOntRequest) returns (RebootOntResponse);
  rpc SetOntWifi(SetOntWifiRequest) returns (SetOntWifiResponse);
  rpc PushOntPppoe(PushOntPppoeRequest) returns (PushOntPppoeResponse);
  rpc LinkOnt(LinkOntRequest) returns (LinkOntResponse);
  rpc UnlinkOnt(UnlinkOntRequest) returns (UnlinkOntResponse);
  rpc PinAcsDevice(PinAcsDeviceRequest) returns (PinAcsDeviceResponse);
  rpc UnpinAcsDevice(UnpinAcsDeviceRequest) returns (UnpinAcsDeviceResponse);
  rpc EnsureAcsPreset(EnsureAcsPresetRequest) returns (EnsureAcsPresetResponse);
}
