name: Integration

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: netops
          POSTGRES_DB: netops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d netops"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:netops@localhost:5432/netops?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: go test -tags=integration ./test/integration/... -v -count=1
