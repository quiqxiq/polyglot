# CATATAN VERSI (dicek langsung per hari ini, bukan tebakan):
#   - golangci/golangci-lint-action versi stabil saat ini adalah v9, dan
#     v7+ HANYA mendukung golangci-lint v2 (selaras .golangci.yml di root
#     yang sudah pakai skema v2). Jangan turunkan ke action versi lama
#     tanpa juga menurunkan skema .golangci.yml ke v1.
#   - actions/checkout dan actions/setup-go dipin ke v6, versi stabil saat
#     ini per contoh resmi golangci-lint-action.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Belum sesuai gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Test
        run: go test ./... -race -cover
