name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Build & Test Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Run Go Build
        run: go build -v ./...

      - name: Verify Go Modules
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -v ./... -race -cover

      - name: Run Go Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1

      - name: Check ConnectRPC Error Boundary
        run: make check-connect-errors

      - name: Check Protobuf Contracts
        run: make proto-check
