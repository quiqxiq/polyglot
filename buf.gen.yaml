version: v2
inputs:
  - directory: api/proto
plugins:
  - local: protoc-gen-go
    out: api/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: api/gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
  - local: web/node_modules/.bin/protoc-gen-connect-es
    out: web/src/gen
    opt: target=ts
