<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPP Secrets - GNet Dial</title>
  <link rel="shortcut icon" href="assets/g.ico" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/dial.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div id="sidebar-container"></div>
  <div id="header-container"></div>
  <div id="mobile-nav-container"></div>
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- Main Content Desktop Centered Wrapper -->
  <div class="lg:pl-64 min-h-screen flex flex-col w-full">
    <main class="w-full max-w-7xl mx-auto pt-20 pb-28 lg:pb-12 px-4 sm:px-8 space-y-6 flex-1">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
          Daftar PPP Secrets
        </h1>
        <p class="text-sm text-slate-500 mt-0.5">Kelola akun pelanggan PPP yang tersimpan di router MikroTik</p>
      </div>
      <button id="refresh-btn" title="Segarkan Data" class="inline-flex items-center justify-center w-9 h-9 bg-white border border-slate-300 rounded-xl text-slate-700 hover:bg-slate-50 hover:text-blue-600 shadow-xs cursor-pointer transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
      </button>
    </div>

    <!-- Filters Bar -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-xs flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="flex flex-1 w-full sm:w-auto gap-3 items-center">
        <div class="relative flex-1 max-w-md">
          <input 
            type="text" 
            id="search-input"
            class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Cari nama akun..."
          >
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
          </div>
        </div>
        <select id="profile-filter" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl px-3 py-2 outline-none">
          <option value="">Semua Profile</option>
        </select>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
        <span id="results-count" class="text-xs text-slate-500 font-medium"></span>
        <select id="per-page-select" class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-lg px-2.5 py-2 outline-none">
          <option value="10">10 Baris</option>
          <option value="25" selected>25 Baris</option>
          <option value="50">50 Baris</option>
          <option value="100">100 Baris</option>
          <option value="all">Semua</option>
        </select>
      </div>
    </div>

    <!-- Results Section -->
    <div id="results-section">
      <!-- Loading Skeleton -->
      <div id="loading-state" class="bg-white border border-slate-200/80 rounded-2xl p-12 text-center text-slate-400 shadow-xs">
        <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-sm font-medium">Memuat data PPP Secrets...</p>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden bg-white border border-slate-200/80 rounded-2xl p-12 text-center text-slate-500 shadow-xs">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-3 text-slate-300"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
        <h3 class="text-base font-semibold text-slate-800">Tidak ada data ditemukan</h3>
        <p class="text-xs text-slate-400 mt-1">Coba sesuaikan kata kunci pencarian atau filter profil</p>
      </div>

      <!-- Card Grid -->
      <div id="results-grid" class="space-y-3"></div>

      <!-- Pagination Container -->
      <div id="pagination-container" class="mt-6"></div>
    </div>
  </main>
</div>

  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/router-selector.js?v=2"></script>
  <script src="js/layout.js?v=2"></script>
  <script src="js/ppp-secrets.js?v=2"></script>
  <script>
    if (Auth.requireAuth()) {
      Layout.init('ppp-secrets.html');
      PPPSecrets.init();
    }
  </script>
</body>
</html>
