<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPP Aktif - GNet Dial</title>
  <link rel="shortcut icon" href="assets/g.ico" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div id="sidebar-container"></div>
  <div id="header-container"></div>
  <div id="mobile-nav-container"></div>
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <main class="pt-20 pb-12 lg:ml-64 lg:pt-20 px-4 sm:px-8 max-w-7xl space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
          Monitoring PPP Aktif
        </h1>
        <p class="text-sm text-slate-500 mt-0.5">Daftar pelanggan yang saat ini sedang terkoneksi (online)</p>
      </div>

      <div class="flex items-center gap-2">
        <button id="batch-kick-btn" class="hidden px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-sm font-semibold shadow-xs cursor-pointer transition-colors">
          Putus Terpilih
        </button>
        <button id="refresh-btn" class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 shadow-xs cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
          Segarkan
        </button>
      </div>
    </div>

    <!-- Filters Bar -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-xs flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:max-w-md">
        <input 
          type="text" 
          id="search-input"
          class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Cari nama, IP, atau Caller ID..."
        >
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
        <span id="results-count" class="text-xs text-slate-500 font-medium"></span>
        <select id="per-page-select" class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-lg px-2.5 py-2 outline-none">
          <option value="10">10 Baris</option>
          <option value="25" selected>25 Baris</option>
          <option value="50">50 Baris</option>
          <option value="100">100 Baris</option>
          <option value="all">Semua</option>
        </select>
      </div>
    </div>

    <!-- Data Container -->
    <div class="bg-white border border-slate-200/80 rounded-2xl shadow-xs overflow-hidden">
      <!-- Loading State -->
      <div id="loading-state" class="p-12 text-center text-slate-400">
        <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-sm font-medium">Memuat sesi PPP aktif...</p>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden p-12 text-center text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-3 text-slate-300"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
        <h3 class="text-base font-semibold text-slate-800">Tidak ada sesi aktif</h3>
        <p class="text-xs text-slate-400 mt-1">Tidak ada koneksi PPP aktif yang cocok dengan filter</p>
      </div>

      <!-- Desktop Table -->
      <div id="active-table-container" class="hidden overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">
              <th class="py-3 px-4 w-10">
                <input type="checkbox" id="select-all-checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
              </th>
              <th class="py-3 px-4 w-12">#</th>
              <th class="py-3 px-4">Pengguna & Caller ID</th>
              <th class="py-3 px-4">Alamat IP</th>
              <th class="py-3 px-4">Uptime</th>
              <th class="py-3 px-4">Layanan</th>
              <th class="py-3 px-4 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="active-tbody"></tbody>
        </table>
        <div id="pagination-container" class="px-4"></div>
      </div>
    </div>

    <!-- Mobile Cards (Visible only on small screens) -->
    <div id="active-cards-container" class="lg:hidden grid grid-cols-1 gap-3"></div>
  </main>

  <!-- Ping Modal -->
  <div id="ping-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h3 class="text-base font-bold text-slate-900">Uji Ping Jaringan</h3>
          <p class="text-xs text-slate-500">Target: <span id="ping-target-name" class="font-semibold text-slate-800"></span> (<span id="ping-target-ip" class="font-mono text-blue-600"></span>)</p>
        </div>
        <button id="close-ping-btn" class="p-1.5 text-slate-400 hover:text-slate-700 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div id="ping-results" class="my-4 bg-slate-900 text-slate-100 p-4 rounded-xl min-h-[120px] max-h-[220px] overflow-y-auto"></div>

      <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
        <button id="start-ping-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-xs transition-colors">
          Mulai Ping
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/router-selector.js?v=2"></script>
  <script src="js/layout.js?v=2"></script>
  <script src="js/ppp-active.js?v=2"></script>
  <script>
    if (Auth.requireAuth()) {
      Layout.init('ppp-active.html');
      PPPActive.init();
    }
  </script>
</body>
</html>
