<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPP Profiles - GNet Dial</title>
  <link rel="shortcut icon" href="assets/g.ico" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div id="sidebar-container"></div>
  <div id="header-container"></div>
  <div id="mobile-nav-container"></div>
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <main class="pt-20 pb-12 lg:ml-64 lg:pt-20 px-4 sm:px-8 max-w-7xl space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          Daftar PPP Profiles
        </h1>
        <p class="text-sm text-slate-500 mt-0.5">Daftar profil rate-limit dan konfigurasi paket PPPoE pada router</p>
      </div>

      <button id="refresh-btn" class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 shadow-xs cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
        Segarkan
      </button>
    </div>

    <!-- Filters Bar -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-xs flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:max-w-md">
        <input 
          type="text" 
          id="search-input"
          class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Cari nama profil atau rate limit..."
        >
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
        </div>
      </div>
      <span id="results-count" class="text-xs text-slate-500 font-medium"></span>
    </div>

    <!-- Table Container -->
    <div class="bg-white border border-slate-200/80 rounded-2xl shadow-xs overflow-hidden">
      <div id="loading-state" class="p-12 text-center text-slate-400">
        <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-sm font-medium">Memuat data PPP Profiles...</p>
      </div>

      <div id="empty-state" class="hidden p-12 text-center text-slate-500">
        <h3 class="text-base font-semibold text-slate-800">Tidak ada profil ditemukan</h3>
        <p class="text-xs text-slate-400 mt-1">Belum ada PPP Profile yang terdaftar pada router</p>
      </div>

      <div id="profiles-table" class="hidden overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">
              <th class="py-3 px-4 w-12">#</th>
              <th class="py-3 px-4">Nama Profil</th>
              <th class="py-3 px-4">Rate Limit</th>
              <th class="py-3 px-4">Local IP</th>
              <th class="py-3 px-4">Remote IP</th>
              <th class="py-3 px-4">DNS Server</th>
              <th class="py-3 px-4">Parent Queue</th>
              <th class="py-3 px-4 text-right">Only One</th>
            </tr>
          </thead>
          <tbody id="profiles-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/router-selector.js?v=2"></script>
  <script src="js/layout.js?v=2"></script>
  <script src="js/ppp-profiles.js?v=2"></script>
  <script>
    if (Auth.requireAuth()) {
      Layout.init('ppp-profiles.html');
      PPPProfiles.init();
    }
  </script>
</body>
</html>
