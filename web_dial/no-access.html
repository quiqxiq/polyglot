<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidak Ada Akses - GNet Dial</title>
  <link rel="shortcut icon" href="assets/g.ico" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/dial.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <main class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-2xl shadow-xl p-8 text-center space-y-5">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-50 text-amber-600 border border-amber-200 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>

      <div class="space-y-2">
        <h1 class="text-xl font-bold text-slate-900" data-i18n="no_access_title">Akses Menu Tidak Tersedia</h1>
        <p class="text-sm text-slate-500 leading-relaxed" data-i18n="no_access_desc">Akun Anda belum memiliki izin untuk membuka menu apa pun di Portal Dial. Hubungi Admin untuk mendapatkan akses.</p>
      </div>

      <div class="flex flex-col sm:flex-row gap-2 justify-center pt-2">
        <button id="no-access-logout-btn" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-sm font-semibold transition-colors cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          <span data-i18n="no_access_logout">Keluar Akun</span>
        </button>
        <button id="no-access-retry-btn" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-colors cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Coba Lagi</span>
        </button>
      </div>

      <button onclick="I18n.toggleLanguage()" class="text-[11px] font-bold text-slate-400 hover:text-slate-600 uppercase tracking-wider cursor-pointer">
        <span id="no-access-lang">ID</span>
      </button>
    </div>
  </main>

  <script src="js/api.js?v=3"></script>
  <script src="js/menu.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/locales.js?v=3"></script>
  <script src="js/i18n.js?v=3"></script>
  <script>
    (async () => {
      if (!Auth.hasSession()) {
        API.redirectToLogin('Silakan login terlebih dahulu');
        return;
      }

      const langEl = document.getElementById('no-access-lang');
      const syncLang = () => { if (langEl) langEl.textContent = I18n.getLanguage().toUpperCase(); };
      syncLang();
      window.addEventListener('languagechange', syncLang);

      document.getElementById('no-access-logout-btn').onclick = () => Auth.logout();
      document.getElementById('no-access-retry-btn').onclick = async () => {
        await Auth.refreshUser().catch(() => {});
        const target = Auth.firstAccessibleRoute();
        window.location.replace(target || 'no-access.html');
      };
    })();
  </script>
</body>
</html>
