# ==============================================================================
# Nginx Reverse Proxy Configuration for GNet Dial (Teknisi Portal)
# Domain: dial.domain.com -> Points to web_dial static files & Polyglot Go backend
# ==============================================================================

server {
    listen 80;
    server_name dial.yourdomain.com;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    # Path ke direktori static web_dial
    root /var/www/polyglot/web_dial;
    index index.html;

    # Logging
    access_log /var/log/nginx/dial_access.log;
    error_log /var/log/nginx/dial_error.log;

    # Gzip Compression untuk static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static frontend routing
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy ConnectRPC requests ke Polyglot Go Backend (:8080)
    location /polyglot.v1. {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering untuk mendukung Server Streaming (StreamLogs, StreamActiveSessions, dll)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy REST API endpoints (jika ada)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}
