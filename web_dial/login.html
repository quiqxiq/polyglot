<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GNet Dial Portal</title>
  <link rel="shortcut icon" href="assets/g.ico" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/dial.css">
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Background Glow -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>

  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 backdrop-blur-xl rounded-2xl shadow-2xl p-8 z-10">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/30 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6.01 18h.01"/><path d="M10.01 18h.01"/><path d="M15 10v4"/><path d="M17.84 7.17a4 4 0 0 0-5.66 0"/><path d="M20.66 4.34a8 8 0 0 0-11.31 0"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">GNet Dial Portal</h1>
      <p class="text-sm text-slate-400 mt-1">Portal Operasional Khusus Admin & Teknisi</p>
    </div>

    <!-- Error Notice Box -->
    <div id="error-box" class="hidden mb-6 p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 text-sm">
      <div class="flex items-start gap-2.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span id="error-message"></span>
      </div>
    </div>

    <!-- Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
        <input 
          type="text" 
          id="username" 
          required 
          autocomplete="username"
          class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          placeholder="Masukkan username Anda"
        >
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          autocomplete="current-password"
          class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          placeholder="••••••••"
        >
      </div>

      <button 
        type="submit" 
        id="submit-btn"
        class="w-full mt-2 py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60"
      >
        <span id="btn-text">Masuk Portal</span>
        <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </form>

    <div class="mt-6 text-center border-t border-slate-700/60 pt-4">
      <p class="text-xs text-slate-500">
        Polyglot ISP Core &bull; MikroTik PPP Operations
      </p>
    </div>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script>
    // Tampilkan notice jika ada
    const notice = sessionStorage.getItem('login_notice');
    if (notice) {
      sessionStorage.removeItem('login_notice');
      showToast(notice, 'info');
    }

    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBox = document.getElementById('error-box');
    const errorMessage = document.getElementById('error-message');

    form.onsubmit = async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = 'Memverifikasi...';
      btnSpinner.classList.remove('hidden');

      try {
        await Auth.login(usernameInput.value, passwordInput.value);
        showToast('Login berhasil! Mengalihkan...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } catch (err) {
        errorBox.classList.remove('hidden');
        let msg = err.message || 'Gagal login. Periksa username dan password.';
        if (msg.toLowerCase().includes('invalid username or password') || err.status === 401) {
          msg = 'Username atau kata sandi salah. Silakan periksa kembali.';
        }
        errorMessage.textContent = msg;
        submitBtn.disabled = false;
        btnText.textContent = 'Masuk Portal';
        btnSpinner.classList.add('hidden');
      }
    };
  </script>
</body>
</html>
