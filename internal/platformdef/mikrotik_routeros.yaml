---
# mikrotik_routeros.yaml — platform definition untuk MikroTik RouterOS CLI
# (SSH), dipakai lewat internal/driver/genericssh dengan
# platformDef="internal/platformdef/mikrotik_routeros.yaml".
#
# INI BUKAN PENGGANTI internal/driver/mikrotik (yang memakai RouterOS API
# lewat go-routeros/v3, lihat docs/adr/0003-*.md) — API tetap jalur utama
# yang direkomendasikan: data terstruktur, tanpa parsing prompt/teks, dan
# sudah mendukung streaming. Platform ini adalah JALUR CADANGAN untuk saat
# akses API tidak tersedia/dimatikan di device (beberapa admin sengaja
# menonaktifkan API demi keamanan, menyisakan cuma SSH), atau untuk command
# yang belum ada di katalog driver API.
#
# Sumber yang dipakai untuk menyusun file ini (bukan tebakan):
#   - Dokumentasi resmi MikroTik soal parameter login SSH/Telnet:
#     https://help.mikrotik.com/docs/spaces/ROS/pages/328134/Command+Line+Interface
#     (bagian "Console login options" — sintaks login_name+parameters)
#   - Isu nyata & terdokumentasi di scrapligo sendiri soal RouterOS meng-
#     echo prompt/command DUA KALI setelah command dikirim lewat SSH:
#     https://github.com/scrapli/scrapligo/issues/95
#   - scrapli_community Python driver untuk mikrotik/routeros (referensi
#     prompt pattern & workaround echo ganda di atas)
#   - Template resmi scrapligo: assets/platforms/example.yaml (struktur
#     field) dan assets/platforms/vyatta_vyos.yaml (referensi vendor
#     dengan privilege level tunggal, mirip kasus RouterOS)
#
# ✅ DIVALIDASI di lab nyata (lihat komentar panjang di
# test/integration/mikrotik_ssh_test.go):
#   - Pattern prompt di bawah ini terverifikasi match terhadap raw bytes
#     aktual RouterOS v6 (192.168.233.1) dan v7 (192.168.230.3), termasuk
#     redraw ganda, submenu path, safe mode, dan identity berspasi.
#   - SUFFIX USERNAME yang terbukti: +cet512w cukup untuk v7 asli
#     (192.168.230.3) DAN firmware G-Net v6 (192.168.233.1) — test
#     integrasi memakai +cet512w di kedua device dan keduanya PASS.
#     (scrapli_community pakai +cet511w4098h; keduanya mengandung
#     c=no-color, t=no-auto-detect, lebar 512/511 — esensinya sama.)
#   - ⚠ TEMUAN PENTING: firmware G-Net RouterOS v6 (banner "PT Gnet Ghaib
#     Network") MENOLAK command path slash-delimited bertingkat
#     ("expected command name (line 1 column N)" di slash kedua),
#     sedangkan RouterOS v7 asli menerimanya. Pakai SPASI sebagai pemisah
#     level ("system resource print") — bentuk yang jalan di semua
#     firmware. Contoh: internal/driver/genericcli catalog untuk platform
#     ini sebaiknya memakai command berspasi.
#
# CATATAN PENTING — WAJIB dibaca sebelum pakai:
#   RouterOS men-support parameter tambahan di login_name, dipisah '+',
#   didokumentasikan resmi oleh MikroTik untuk SSH/Telnet:
#     c = disable console colors      (hilangkan kode warna ANSI di output)
#     e = enable "dumb" terminal mode (nonaktifkan redraw/fitur canggih)
#     t = disable auto-detection      (RouterOS tidak coba deteksi terminal)
#     <n>w = set terminal width ke n  (mis. 512w)
#   Rekomendasi MikroTik & Ansible community.routeros: pakai suffix
#   "+cet512w" di username. INI HARUS DISET DI SISI PEMANGGIL, bukan di
#   file YAML ini (YAML platform tidak punya field untuk memodifikasi
#   username) — set device.Target.Username = "<username_asli>+cet512w"
#   saat membangun genericssh.NewDriver untuk platform ini. Lihat
#   test/integration/mikrotik_ssh_test.go untuk contoh konkret.
#
#   Kalau setelah itu MASIH ada gejala seperti di issue #95 (Execute
#   sepertinya menggantung / tidak dapat balasan), tambahkan
#   genericcli.Catalog.ReadDelay (mis. 100*time.Millisecond) — itu sudah
#   disediakan justru untuk kasus ini, lihat komentar di
#   internal/driver/genericcli/catalog.go.
platform-type: 'mikrotik_routeros'
default:
  # RouterOS CLI tidak punya mode privilege terpisah gaya Cisco (tidak ada
  # "enable"/"configure terminal" — semua command dijalankan langsung di
  # root prompt, path lengkap seperti "/system/resource/print" selalu bisa
  # dipanggil dari mana pun). driver-type tetap 'network' (bukan
  # 'generic') karena HANYA network-driver yang scrapligo dukung untuk
  # hook on-open/on-close lewat YAML (dicek langsung di source
  # scrapligo — tidak ada "generic-on-open" yang setara) — dipakai untuk
  # on-close mengirim "quit" dengan rapi. Cukup satu privilege level tanpa
  # escalate/deescalate sama sekali, sama seperti pola exec-level di
  # vyatta_vyos.yaml bawaan scrapligo.
  driver-type: 'network'

  privilege-levels:
    exec:
      name: 'exec'
      # [user@identity] > , dengan beberapa hal yang wajib ditoleransi:
      #   - identity (nama router) BOLEH mengandung spasi — dikonfirmasi
      #     lewat scrapli_community issue #20 ("Test Router" sebagai nama).
      #   - safe mode menambahkan "<SAFE>" sebelum ">" (Ctrl+X/F4).
      #   - kalau sedang berada di dalam menu (mis. habis "/interface"
      #     tanpa print), prompt menyisipkan path sebelum ">" — meski
      #     driver ini selalu kirim path lengkap per command jadi
      #     seharusnya tidak pernah benar-benar "nyangkut" di submenu,
      #     pattern tetap dibuat toleran terhadap itu untuk jaga-jaga.
      #
      # ⚠ DIVALIDASI DI LAB (v6 192.168.233.1 & v7 192.168.230.3):
      # DUA alasan pattern lama ber-anchor `^...$` TIDAK PERNAH match dan
      # Open() selalu timeout fetching prompt (verifikasi dari raw bytes
      # aktual + source scrapligo):
      #   1. scrapligo channel/read.go MENGHAPUS semua \r dari data masuk
      #      (bytes.ReplaceAll(b, "\r", "")), sementara prompt RouterOS
      #      memakai CR-only line ending — jadi tidak pernah ada baris baru
      #      untuk di-anchor `^`/`$`.
      #   2. prompt RouterOS di-redraw 2x dalam satu chunk (redraw lebar
      #      terminal 512): `[admin@x] > <spasi>[admin@x] > `. Prompt
      #      pertama tidak pernah berakhir di akhir teks (masih ada
      #      padding + redraw) sehingga `$` gagal; prompt kedua ada di
      #      akhir teks tapi tidak didahului baris baru sehingga `^` gagal.
      #      Ditambah processReadBuf yang memotong buffer ke 1000 byte
      #      terakhir (PromptSearchDepth) mulai dari tengah padding spasi.
      # Fix final (DIVALIDASI di lab, dua iterasi):
      #   Iterasi 1 — pattern TANPA anchor `^`/`$`:
      #     - Fix dari masalah awal: `^...$` tidak pernah match karena (a)
      #       scrapligo menghapus semua \r (prompt RouterOS CR-only, jadi
      #       tidak ada baris baru untuk di-anchor), dan (b) prompt di-
      #       redraw 2x dalam satu chunk sehingga prompt pertama tak pernah
      #       di akhir teks dan prompt kedua tak pernah di awal baris.
      #     - TAPI pattern tanpa anchor MATCH ECHO saat command diketik:
      #       prompt lama `[admin@x] > ` muncul di awal baris echo, jadi
      #       ReadUntilPrompt berhenti di echo dan output terpotong.
      #   Iterasi 2 (INI YANG DIPAKAI) — pattern tanpa `^` tapi DENGAN `$`:
      #     - `$` memaksa prompt yang match berada di AKHIR buffer. Echo
      #       tidak pernah match: setelah `>` selalu ada teks command pada
      #       baris yang sama, sehingga `$` gagal.
      #     - SENG AJA TIDAK pakai flag (?m): dengan (?m), `$` juga match
      #       di akhir baris mana pun (sebelum \n), dan scrapligo menghapus
      #       \r tapi MENYIMPAN \n dari output — itu melemahkan tujuan `$`.
      #       Tanpa (?m), `$` = end-of-text SAJA, tempat prompt final selalu
      #       berada. Terverifikasi: 10 case (prompt tunggal, redraw 2x,
      #       echo, submenu, <SAFE>, identity berspasi, v6/v7) tetap match
      #       dengan (?i) saja, dan dua case echo yang HARUS ditolak tetap
      #       ditolak.
      #     - Prompt redraw kedua selalu di akhir buffer → match tepat.
      #     - `(?:[\w.\-/]+\s*)?` opsional menoleransi path submenu (mis.
      #       "/ip").
      pattern: '(?i)\[[\w.\-]{1,32}@[^\]\r\n]{1,64}\]\s*(?:<SAFE>\s*)?(?:[\w.\-/]+\s*)?\S*>\s*$'
      not-contains:
      previous-priv:
      deescalate:
      escalate:
      escalate-auth: false
      escalate-prompt:

  default-desired-privilege-level: 'exec'

  # Pesan error CLI RouterOS yang umum — daftar ini disusun dari
  # pengetahuan umum sintaks command RouterOS, BELUM divalidasi lengkap ke
  # device fisik. Tambahkan pesan lain yang Anda temukan di lab Anda ke
  # sini (bukan ke genericcli.Catalog.FailedWhenContains, kecuali memang
  # spesifik per-device, bukan per-platform — lihat
  # internal/platformdef/README.md soal pembagian ini).
  failed-when-contains:
    - 'bad command name'
    - 'no such item'
    - 'syntax error'
    - 'expected end of command'
    - 'input does not match any value'
    - 'failure:'

  textfsm-platform: 'mikrotik_routeros' # diabaikan di Go, cuma dipakai scrapli Python

  network-on-open:
    - operation: 'acquire-priv'
    # Sengaja TIDAK ada command "disable paging" di sini seperti Cisco
    # ("terminal length 0") — RouterOS mengatur ini lewat parameter login
    # di username (lihat CATATAN PENTING di atas), bukan lewat command
    # setelah sesi terbuka.

  network-on-close:
    - operation: 'acquire-priv'
    - operation: 'channel.write'
      input: 'quit'
    - operation: 'channel.return'
