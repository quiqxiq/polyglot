services:
  server:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MIKROTIK_TEST_HOST=192.168.230.3
      - MIKROTIK_TEST_PORT=8728
      - MIKROTIK_TEST_USER=admin
      - MIKROTIK_TEST_PASS=r00t
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=netops
      - POSTGRES_DB=netops
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: netops
      POSTGRES_DB: netops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
