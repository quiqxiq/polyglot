# ==============================================================================
# Polyglot Gateway - Nginx Virtual Host Configuration
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

upstream polyglot_backend {
    server server:8080;
    keepalive 32;
}

# 1. Dedicated Subdomain for GNet Dial (Teknisi Portal)
server {
    listen 80;
    server_name dial.* ~^dial\..+$;

    root /usr/share/nginx/html/dial;
    index index.html;

    # Disable cache for static assets and HTML to prevent stale UI in dev
    location ~* \.(?:html|js|css|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Proxy ConnectRPC requests ke Polyglot Go Backend
    location /polyglot.v1. {
        proxy_pass http://polyglot_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering & compression untuk streaming RPC
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # WebSocket & chunked streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Proxy REST API
    location /api/ {
        proxy_pass http://polyglot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Default Server (Main ISP Web Admin + sub-path /dial/)
server {
    listen 80 default_server;
    server_name _;

    # Root for main React frontend
    root /usr/share/nginx/html/app;
    index index.html;

    # GNet Dial accessible via subpath /dial/
    location ^~ /dial/ {
        alias /usr/share/nginx/html/dial/;
        try_files $uri $uri/ /dial/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Proxy ConnectRPC requests
    location /polyglot.v1. {
        proxy_pass http://polyglot_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # WebSocket & chunked streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Proxy REST API
    location /api/ {
        proxy_pass http://polyglot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime Server-Sent Events (/events)
    location /events {
        proxy_pass http://polyglot_backend/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Realtime WebSocket Stream (/terminal/stream, /ws)
    location /terminal/stream {
        proxy_pass http://polyglot_backend/terminal/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Model Context Protocol / AI endpoints
    location /mcp {
        proxy_pass http://polyglot_backend/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Web Admin SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
